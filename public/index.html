<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Stat Master</title><link rel="icon" href="/anvil.png"><link rel="stylesheet" href="/style.css"></head><body><main><h1><span class="anvil-action"><button id="calculate" type="button" disabled aria-label="DPS와 HPS 계산하기"><img src="/anvil.png" alt="Stat Master" width="512" height="512"></button><span id="calculate-label" hidden>계산하기</span></span></h1><form aria-label="총 스탯" onsubmit="return false"><div class="totals"><div class="total"><label for="totalDamage">총 피해:</label><div class="value"><input id="totalDamage" name="totalDamage" type="number" min="0.000000000001" step="any" inputmode="decimal" placeholder="0.00" required autocomplete="off"><div class="unit-controls" role="group" aria-label="총 피해 단위"><button type="button" data-unit="k" aria-pressed="true">k</button><button type="button" data-unit="m" aria-pressed="false">m</button><button type="button" data-unit="b" aria-pressed="false">b</button><button type="button" data-unit="t" aria-pressed="false">t</button></div></div></div>
<div class="total"><label for="totalHealth">총 체력:</label><div class="value"><input id="totalHealth" name="totalHealth" type="number" min="0.000000000001" step="any" inputmode="decimal" placeholder="0.00" required autocomplete="off"><div class="unit-controls" role="group" aria-label="총 체력 단위"><button type="button" data-unit="k" aria-pressed="true">k</button><button type="button" data-unit="m" aria-pressed="false">m</button><button type="button" data-unit="b" aria-pressed="false">b</button><button type="button" data-unit="t" aria-pressed="false">t</button></div></div></div></div><p class="input-help">게임에 표시된 보너스 적용 후 총 피해·총 체력을 입력해 주세요. 치명타 피해도 기본 20%가 포함된 표시값을 입력합니다.</p><div class="fairy-settings"><div class="stat"><label for="fairy">요정</label><select id="fairy" name="fairy"><option value="none">없음</option><option value="mira">Mira · 치명타</option><option value="tira">Tira · 블록</option><option value="lora">Lora · 반사</option></select></div><div class="stat"><label for="fairyLevel">요정 레벨</label><input id="fairyLevel" name="fairyLevel" type="number" min="1" max="20" step="1" value="10" inputmode="numeric" required></div></div><p class="input-help">요정 효과가 포함된 스탯을 입력해 주세요. 피해·체력 %는 총수치의 보너스 적용 전 기준값을 역산하는 데 사용합니다.</p><div class="secondary-stats"><div class="stat"><label for="damage">피해:</label><div class="value"><input id="damage" name="damage" type="number" min="0" step="any" inputmode="decimal" placeholder="0" required aria-label="피해 (%)" autocomplete="off"><span aria-hidden="true">%</span></div></div><div class="stat"><label for="health">체력:</label><div class="value"><input id="health" name="health" type="number" min="0" step="any" inputmode="decimal" placeholder="0" required aria-label="체력 (%)" autocomplete="off"><span aria-hidden="true">%</span></div></div><div class="stat"><label for="critChance">치명타 확률:</label><div class="value"><input id="critChance" name="critChance" type="number" min="0" step="any" inputmode="decimal" placeholder="0" required aria-label="치명타 확률 (%)" autocomplete="off"><span aria-hidden="true">%</span></div></div>
<div class="stat"><label for="critDamage">치명타 피해:</label><div class="value"><input id="critDamage" name="critDamage" type="number" min="20" step="any" inputmode="decimal" placeholder="20" required aria-label="치명타 피해 (기본 20% 포함)" autocomplete="off"><span aria-hidden="true">%</span></div></div>
<div class="stat"><label for="block">블록 확률:</label><div class="value"><input id="block" name="block" type="number" min="0" step="any" inputmode="decimal" placeholder="0" required aria-label="블록 확률 (%)" autocomplete="off"><span aria-hidden="true">%</span></div></div>
<div class="stat"><label for="regen">체력 재생:</label><div class="value"><input id="regen" name="regen" type="number" min="0" step="any" inputmode="decimal" placeholder="0" required aria-label="체력 재생 (%)" autocomplete="off"><span aria-hidden="true">%</span></div></div>
<div class="stat"><label for="lifesteal">생명력 흡수:</label><div class="value"><input id="lifesteal" name="lifesteal" type="number" min="0" step="any" inputmode="decimal" placeholder="0" required aria-label="생명력 흡수 (%)" autocomplete="off"><span aria-hidden="true">%</span></div></div>
<div class="stat"><label for="doubleChance">더블 찬스:</label><div class="value"><input id="doubleChance" name="doubleChance" type="number" min="0" step="any" inputmode="decimal" placeholder="0" required aria-label="더블 찬스 (%)" autocomplete="off"><span aria-hidden="true">%</span></div></div>

<div class="stat"><label for="melee">근접 피해:</label><div class="value"><input id="melee" name="melee" type="number" min="0" step="any" inputmode="decimal" placeholder="0" required aria-label="근접 피해 (%)" autocomplete="off"><span aria-hidden="true">%</span></div></div>
<div class="stat"><label for="ranged">원거리 피해:</label><div class="value"><input id="ranged" name="ranged" type="number" min="0" step="any" inputmode="decimal" placeholder="0" required aria-label="원거리 피해 (%)" autocomplete="off"><span aria-hidden="true">%</span></div></div>
<div class="stat"><label for="attackSpeed">공격 속도:</label><div class="value"><input id="attackSpeed" name="attackSpeed" type="number" min="0" step="any" inputmode="decimal" placeholder="0" required aria-label="공격 속도 (%)" autocomplete="off"><span aria-hidden="true">%</span></div></div>
<div class="stat"><label for="skillDamage">스킬 피해:</label><div class="value"><input id="skillDamage" name="skillDamage" type="number" min="0" step="any" inputmode="decimal" placeholder="0" required aria-label="스킬 피해 (%)" autocomplete="off"><span aria-hidden="true">%</span></div></div>
<div class="stat"><label for="skillCooldown">스킬 재사용 대기시간:</label><div class="value"><input id="skillCooldown" name="skillCooldown" type="number" step="any" inputmode="decimal" placeholder="0" required aria-label="스킬 재사용 대기시간 (%)" autocomplete="off"><span aria-hidden="true">%</span></div></div>
<div class="stat attack-type"><span id="attack-type-label">공격 유형:</span><div class="unit-controls" role="group" aria-labelledby="attack-type-label"><button type="button" data-attack-type="ranged" aria-pressed="true">원거리</button><button type="button" data-attack-type="melee" aria-pressed="false">근거리</button></div></div></div><p id="form-error" role="alert"></p></form></main><script src="/stats.js" defer></script><script type="module" src="/flow.mjs"></script></body></html>
